[project]
name = "agent-core"
version = "0.1.0"
description = "agent-server 多服务共享库:auth / run-engine / queue / llm / vector / 配置与日志"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "redis>=5.0",
  "PyJWT[crypto]>=2.8",
  "openai>=1.40",
  "pymilvus>=2.4.4",
  "pulsar-client>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
