version: v2
plugins:
  # ① node-server 内部消费(bundle 进镜像,构建期零外部依赖);保持原样。
  # 钉版本 v2.11.8 与 our-chat 保持一致,保证跨仓生成物可复现、freshness CI 稳定。
  - remote: buf.build/community/stephenh-ts-proto:v2.11.8
    out: apps/node-server/src/contracts/gen
    opt:
      - onlyTypes=true
      - forceLong=number
      - useDate=string
      - useOptionals=messages
      - esModuleInterop=true
  # ② 对外发布产物:@talqora/agent-contracts 的 TS 源。与①同插件同 opt,
  #    单次 buf generate 产出两份字节一致的 gen;发布包给 web 及未来 TS 消费方。
  #    权威始终是 proto,本目录是它的生成物(freshness CI 校验不漂移)。
  - remote: buf.build/community/stephenh-ts-proto:v2.11.8
    out: packages/agent-contracts/src/gen
    opt:
      - onlyTypes=true
      - forceLong=number
      - useDate=string
      - useOptionals=messages
      - esModuleInterop=true
  # ③ rag-server(Python)消费:betterproto2 + pydantic dataclass 生成。
  #    本地插件(betterproto2_compiler==0.10.0,与运行时 betterproto2 版本钉死):
  #      uv tool install betterproto2_compiler==0.10.0   # 提供 protoc-gen-python_betterproto2
  #    生成物 = 契约类型在 Python 侧的单一来源(禁止手改);FastAPI 直接消费:
  #    请求走生成类型(导入后 apply_camel_aliases 注入 camelCase alias),
  #    响应走 to_dict()(proto3-JSON,camelCase 权威)。
  - local: protoc-gen-python_betterproto2
    out: apps/rag-server/src/rag_server/contracts/gen
    opt:
      - pydantic_dataclasses
